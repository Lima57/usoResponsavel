<head>

    <style>
*{

}

body{
    background-image:url('Imagens/globo.png');
    background-color: rgba(0,0,0,0.7);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: left left;
    color:white;
}

header{
    width:100%;
    background:rgba(0,0,0,0.7);

    display:flex;
    justify-content:space-between;

header h2{

}

header nav a{

    color:#4fa3ff;
}

.conta-btn{

    border-radius:8px;
    color:white;
    text-decoration:none;
    font-weight:600;
}

.home{
    padding-top:120px;
    text-align:center;
}

.home p{
    font-size:22px;
    width:70%;
    margin:auto;
}

/* CATEGORIAS */
.categorias{
    padding-top:120px;
    text-align:center;
}

.card-container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

.card{
    background:#2b2b2b;
    padding:20px;
    width:300px;
    border-radius:12px;
    text-align:left;
}

.card img{
    width:100%;
    border-radius:10px;
}

.card a{
    text-decoration:none;
    color:white;
}

</head>
