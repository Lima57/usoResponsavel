<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>

<div class="login-container">
    
    <div class="login-left">
        <div>
            <h2>USO RESPONSÁVEL</h2>
            <h1>BEM VINDO</h1>
            <p>Usoresponsavel.com</p>
        </div>
    </div>

    <div class="login-right">
        <h2>LOGIN</h2>
        <p>Bem vindo de volta ao nosso site!</p>

        <form action="Inicio.html">
            <label>Nome de usuário</label>
            <input type="text" required>

            <label>Senha</label>
            <input type="password" required>

            <button class="login-btn">LOGIN</button>
        </form>

        <p style="margin-top:15px;">É novo por aqui? <a href="#">Crie uma conta</a></p>
    </div>

</div>

</body>
</html>
